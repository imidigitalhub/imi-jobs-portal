<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Portal Admin | IMI DIGITAL HUB</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:980px;margin:48px auto;padding:0 20px}.admin-panel{background:#fff;border:1px solid #dbe3ea;border-radius:16px;padding:24px;margin:20px 0;box-shadow:0 8px 30px #102a4310}.admin-panel h1,.admin-panel h2{margin-top:0}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}.admin-form input,.admin-form select,.admin-form textarea{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;width:100%;box-sizing:border-box}.admin-form textarea{min-height:120px}.wide{grid-column:1/-1}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.admin-btn{padding:12px 18px;border:0;border-radius:8px;background:#102a43;color:#fff;font-weight:700;cursor:pointer}.admin-btn.secondary{background:#e8eef4;color:#102a43}.admin-btn.danger{background:#a52626}.admin-list{display:grid;gap:10px}.admin-item{border:1px solid #dbe3ea;border-radius:10px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.admin-item p{margin:4px 0;color:#64748b}.status-msg{padding:12px;border-radius:8px;background:#eef5ff;margin:12px 0}.hidden{display:none!important}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.wide{grid-column:auto}.admin-item{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">IMI</span><span>IMI <b>DIGITAL HUB</b><small>Portal administration</small></span></a><nav><a href="index.html">View public portal</a></nav></header>
<main class="admin-wrap"><section class="admin-panel" id="loginPanel"><h1>Administrator sign in</h1><p>Sign in with the administrator account created in Supabase.</p><form id="loginForm" class="admin-form"><label class="wide">Email address<input id="email" type="email" autocomplete="username" required value="mullarmediaandcommunications@gmail.com"></label><label class="wide">Password<input id="password" type="password" autocomplete="current-password" required></label><div class="wide"><button class="admin-btn" type="submit">Sign in</button></div></form><div id="loginMessage" class="status-msg hidden" role="status"></div></section>
<section class="admin-panel hidden" id="dashboard"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1>Opportunities dashboard</h1><p>Manage listings. Unpublished items stay hidden from public visitors.</p></div><button class="admin-btn secondary" id="signOut">Sign out</button></div><div id="adminMessage" class="status-msg hidden" role="status"></div>
<h2 id="formHeading">Add an opportunity</h2><form id="opportunityForm" class="admin-form"><input id="recordId" type="hidden"><label>Opportunity title<input id="title" required maxlength="180"></label><label>Organisation / employer<input id="organization" required maxlength="180"></label><label>Category<select id="category" required><option>Jobs</option><option>Scholarships</option><option>Internships</option><option>Grants</option><option>Training</option></select></label><label>Location<input id="location" placeholder="e.g. Abuja, Nigeria or Remote"></label><label>Employment / opportunity type<input id="employment_type" placeholder="e.g. Full-time, Online, Undergraduate"></label><label>Application deadline<input id="deadline" type="date"></label><label class="wide">Description and requirements<textarea id="description" required></textarea></label><label>Application URL<input id="application_url" type="url" placeholder="https://"></label><label>Official source URL<input id="source_url" type="url" placeholder="https://"></label><label class="wide">Eligibility (optional)<textarea id="eligibility"></textarea></label><label>Salary / funding amount (optional)<input id="salary_or_funding" placeholder="e.g. ₦150,000 monthly or $5,000 grant"></label><label class="wide">Benefits (optional)<textarea id="benefits" placeholder="List salary benefits, accommodation, insurance, tuition support, etc."></textarea></label><label class="wide">Application instructions (optional)<textarea id="application_instructions" placeholder="Explain the steps applicants should follow."></textarea></label><label class="wide">Opportunity image (JPG, PNG or WebP; maximum 5 MB)<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><small>Choose a clear image or flyer. Leave empty to keep the existing image when editing.</small></label><input id="currentImageUrl" type="hidden"><img id="imagePreview" class="wide hidden" alt="Opportunity image preview" style="max-width:100%;max-height:260px;object-fit:contain;border:1px solid #dbe3ea;border-radius:10px;padding:6px;"><label class="wide" style="flex-direction:row;align-items:center"><input id="is_published" type="checkbox" style="width:auto"> Publish this opportunity immediately</label><div class="wide admin-actions"><button class="admin-btn" type="submit">Save opportunity</button><button class="admin-btn secondary" type="button" id="resetForm">Clear form</button></div></form><h2 style="margin-top:32px">Your listings</h2><div id="adminList" class="admin-list">Loading…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
